name: Set up the tools
description: Install Node.js, Python, and the dependencies of both, with caching.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      id: python
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements.txt
    - run: npm ci
      shell: bash
    - run: npm run setup:python
      shell: bash
      env:
        # Runners have several Pythons. Use the one installed above, which matches the cache.
        PYTHON: ${{ steps.python.outputs.python-path }}
